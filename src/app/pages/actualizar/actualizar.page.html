<ion-content class="update-screen">
  <div class="update-container">

    <div class="update-icon">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </div>

    <h1 class="update-title">Actualización requerida</h1>
    <p class="update-body">
      Esta versión de la aplicación ya no está soportada. Por favor, actualiza para seguir disfrutando de Soluna Pilates.
    </p>

    <button class="sl-btn-primary update-btn" (click)="openStore()">
      Actualizar ahora
    </button>

  </div>
</ion-content>
