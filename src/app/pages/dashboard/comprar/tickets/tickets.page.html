<ion-content color="light">
    <!---------------------------------------------------CARD DONDE BUSCAMOS TICKETS---------------------------------------------------->
    <ion-card class="pb-0  px-0 border-top">
        <ion-card-header>
            <ion-card-title class="border-bottom">COMPRAR TICKET</ion-card-title>
        </ion-card-header>
        <ion-card-content>
            <!---------------------------------------------ESCOGER CENTRO------------------------------------>
            <select class="form-select mb-2" (change)="buscarTicketsAComprar()" [(ngModel)]="idCentro">
                <!-- <option value=null selected>Centro</option> -->
                <option [value]="centro.id" *ngFor="let centro of centros">{{centro.center_name}}</option>
                <!-- <option value="1">La Florida</option>
                <option value="2">Aviles</option> -->
            </select>
            <!--------------------------------------CALENDARIO PARA ESCOGER DIA---------------------------------->
            <input (change)="buscarTicketsAComprar()" [(ngModel)]="fechaElegida" class="form-control" type="text" mwlFlatpickr [altInput]="true" [convertModelValue]="true" dateFormat="Y-m-d" altFormat="F j, Y" placeholder="Fecha" [options]="datePickerOptions" />
        </ion-card-content>
    </ion-card>

        <!-------------------------------------------------TARJETA 1------------------------------------------------>
        <ion-card class="mx-0 mt-0 border-top border-radius" *ngFor="let ticket of tickets">
            <ion-card-header>
                <ion-card-subtitle>{{diaSemana}}, {{fechaString}}, {{ticket.start_time}}</ion-card-subtitle>
                <ion-card-title>{{ticket.activity_name}}</ion-card-title>
                <ion-card-subtitle>{{ticket.price}}&euro;</ion-card-subtitle>
            </ion-card-header>
            <ion-card-content>
                <button class="btn" id="comprar" (click)="comprarModal(ticket.activity_id, ticket.center_id, ticket.id, ticket.price, ticket.ticket_type)">COMPRAR</button>
            </ion-card-content>
        </ion-card>

                <ion-card-title>No hay clases disponibles</ion-card-title>
