<ion-content style="--background: var(--sl-bg)">

  <div class="tickets-header">
    <h1 class="tickets-title">Comprar Ticket</h1>
    <p class="tickets-subtitle">Selecciona centro y fecha</p>
  </div>

  <div class="tickets-content">

    <!-- Filters -->
    <div class="filter-card">
      <div class="filter-row">
        <label class="sl-label">Centro</label>
        <div class="sl-select-wrap">
          <select class="sl-select" (change)="buscarTicketsAComprar()" [(ngModel)]="idCentro">
            <option [value]="centro.id" *ngFor="let centro of centros">{{ centro.center_name }}</option>
          </select>
          <svg class="sl-select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </div>
      </div>

      <div class="filter-divider"></div>

      <div class="filter-row">
        <label class="sl-label">Fecha</label>
        <input
          class="sl-date-input"
          (change)="buscarTicketsAComprar()"
          [(ngModel)]="fechaElegida"
          type="text"
          mwlFlatpickr
          [altInput]="true"
          [convertModelValue]="true"
          dateFormat="Y-m-d"
          altFormat="j F, Y"
          placeholder="Seleccionar fecha"
          [options]="datePickerOptions"
        />
      </div>
    </div>

    <!-- Loading -->
    <div class="tickets-loading" *ngIf="loading">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>

    <!-- Ticket cards -->
    <div *ngIf="tickets">
      <div class="ticket-purchase-card" *ngFor="let ticket of tickets">
        <div class="ticket-purchase-body">
          <div class="ticket-purchase-activity">{{ ticket.activity_name }}</div>
          <div class="ticket-purchase-meta">
            {{ diaSemana }}, {{ fechaString }}
            <span class="meta-dot"></span>
            {{ ticket.start_time }}
          </div>
          <div class="ticket-purchase-price">{{ ticket.price }}€</div>
        </div>
        <button class="sl-btn-accent"
          (click)="comprarModal(ticket.activity_id, ticket.center_id, ticket.id, ticket.price, ticket.ticket_type, ticket, diaSemana, fechaString)">
          Comprar
        </button>
      </div>
    </div>

    <!-- No results -->
    <div class="tickets-empty" *ngIf="tickets == null && !loading">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <span>Sin clases disponibles</span>
      <small>Prueba con otra fecha u otro centro</small>
    </div>

  </div>

</ion-content>
