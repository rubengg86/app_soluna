<ion-content color="light">
    <!---------------------------------------------------CARD DONDE BUSCAMOS TICKETS---------------------------------------------------->
    <ion-card class="pb-0  px-0 border-top">
        <ion-card-header>
            <ion-card-title class="border-bottom">COMPRAR TICKET</ion-card-title>
        </ion-card-header>
        <ion-card-content>
            <!---------------------------------------------ESCOGER CENTRO------------------------------------>
            <select class="form-select mb-2">
                <option selected>Centro</option>
                <option value="1">La Florida</option>
                <option value="2">Aviles</option>
            </select>
            <!--------------------------------------CALENDARIO PARA ESCOGER DIA---------------------------------->
            <input class="form-control" type="text" mwlFlatpickr [altInput]="true" [convertModelValue]="true" dateFormat="Y-m-d" altFormat="F j, Y" placeholder="Fecha" [options]="datePickerOptions" />
        </ion-card-content>
    </ion-card>

    <!---------------------------------------------------SI NO HAY TICKETS---------------------------------------------------->
    <!--
<ion-card *ngIf="!ticket" class=" my-2 py-2 px-0">
    <ion-card-header>
        <ion-card-title class="border-bottom">¡Ups!</ion-card-title>
    </ion-card-header>
    <ion-card-content>
        <p class="text-left">No hay ninguna clase disponible para el d&iacute;a y centro seleccionados</p>
    </ion-card-content>
</ion-card> 
-->

    <!-----------------------------------------------------SI HAY TICKETS------------------------------------------------------>
    <ion-card *ngIf="ticket" class=" px-0 border-top" >
       
       <!------------------------------------------------BOTONES: AYER - HOY - MAÑANA-->
        <div class="text-center">
            <ion-chip id="botonDia">
                <ion-icon name="chevron-back-outline"></ion-icon>
                <ion-label color="dark" class="page-link"><span style="padding-right:3px">Ayer</span> {{dia - 1}}/{{mes}}</ion-label>
            </ion-chip>
                
            <ion-chip id="botonDia">
                <ion-label color="dark" class="page-link"><span style="padding-right:3px">Hoy</span> {{dia}}/{{mes}}</ion-label>
            </ion-chip>
                
            <ion-chip id="botonDia">
                <ion-label color="dark" class="page-link"><span style="padding-right:3px">Mañana</span>  {{dia + 1}}/{{mes}}</ion-label>
                <ion-icon name="chevron-forward-outline"></ion-icon>
            </ion-chip>
        </div>
          
        <!-------------------------------------------------TARJETA 1------------------------------------------------>
        <ion-card class="mx-0 mt-0 border-top border-radius">
            <ion-card-header>
                <ion-card-subtitle>Martes, 01/06, 9:30</ion-card-subtitle>
                <ion-card-title>La Florida, Pilates</ion-card-title>
            </ion-card-header>
            <ion-card-content>
                <button class="btn" id="comprar" (click)="comprarModal()">COMPRAR</button>
            </ion-card-content>
        </ion-card>
        <!-------------------------------------------------TARJETA 2------------------------------------------------>
        <ion-card class="mx-0 mt-0 border-top border-radius">
            <ion-card-header>
                <ion-card-subtitle>Martes, 01/06, 9:30</ion-card-subtitle>
                <ion-card-title>La Florida, Pilates</ion-card-title>
            </ion-card-header>
            <ion-card-content>
                <button class="btn" id="comprar" (click)="comprarModal()">COMPRAR</button>
            </ion-card-content>
        </ion-card>
        <!--------------------------------------------------------------------PAGINADOR------------------------------------------------------------------>
        <nav aria-label="Page navigation example" >
            <ul class="pagination justify-content-center" id="listadoPie">
                <li class="page-item disabled">
                    <a class="page-link" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                        <span class="sr-only">Previous</span>
                    </a>
                </li>
                <li class="page-item"><a class="page-link">1</a></li>
                <li class="page-item"><a class="page-link">2</a></li>
                <li class="page-item"><a class="page-link">3</a></li>
                <li class="page-item">
                    <a class="page-link" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                        <span class="sr-only">Next</span>
                    </a>
                </li>
            </ul>
        </nav>
    </ion-card>
</ion-content>
