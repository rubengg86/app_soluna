<ion-content style="--background: #363636;">
    <!-- <ion-content color="light"> -->
    <ion-card class="border-top" *ngIf="yogaRegalo">
        <ion-card-header>
            <ion-card-title class="border-bottom">{{yogaRegalo.activity_name}}<i class="fas fa-angle-double-left fa-lg" [routerLink]="['/dashboard/bono-regalo']"></i></ion-card-title>
            <!-- <ion-card-title class="border-bottom">YOGA<i class="fas fa-angle-double-left fa-lg" [routerLink]="['/dashboard/bono-regalo']"></i></ion-card-title> -->
            <ion-card-subtitle>
                <div class="border-bottom">
                    <!-- <h5>¿Qu&eacute; es?</h5> -->
                    <p>{{yogaRegalo.description_es}}</p>
                    <!-- <p>Es la evolución de las técnicas más populares como el pilates, el fitness y el yoga, proyectándolas a un nuevo plano. Con el columpio como elementro central, transformamos estas actividades y las hacemos más dinámicas.</p> -->
                </div>
                <p class="mt-2">Usalo cuando <span class="fw-normal">quieras</span>, para ti o para <span class="fw-normal">regalo</span> con <span class="fw-normal">1 año</span> de caducidad</p>
            </ion-card-subtitle>
        </ion-card-header>
        <ion-card-content id="columnas">
            <ion-card class="text-center mx-0 mt-0 border-top">
                <ion-card-header>
                    <ion-card-subtitle id="mes">1 Mes</ion-card-subtitle>
                    <ion-card-title class="fw-normal" id="dinero">{{precio1mes | number: '.0-0'}}&euro;</ion-card-title>
                    <!-- <ion-card-title class="fw-normal" id="dinero">55&euro;</ion-card-title> -->
                </ion-card-header>
                <ion-card-content>
                    <button class="btn" id="comprar">Próximamente</button>
                    <!-- <button class="btn" id="comprar" (click)="comprarModal()">Próximamente</button> -->
                </ion-card-content>
            </ion-card>

            <ion-card class="text-center mx-0 mt-0 border-top">
                <ion-card-header>
                    <ion-card-subtitle id="mes">2 Mes</ion-card-subtitle>
                    <ion-card-title class="fw-normal" id="dinero">{{precio2mes}}&euro;</ion-card-title>
                </ion-card-header>
                <ion-card-content>
                    <button class="btn" id="comprar">Próximamente</button>
                    <!-- <button class="btn" id="comprar" (click)="comprarModal()">Próximamente</button> -->
                </ion-card-content>
            </ion-card>

            <ion-card class="text-center mx-0 mt-0 border-top">
                <ion-card-header>
                    <ion-card-subtitle id="mes">3 Mes</ion-card-subtitle>
                    <ion-card-title class="fw-normal" id="dinero">{{precio3mes}}&euro;</ion-card-title>
                </ion-card-header>
                <ion-card-content>
                    <button class="btn" id="comprar">Próximamente</button>
                    <!-- <button class="btn" id="comprar" (click)="comprarModal()">Próximamente</button> -->
                </ion-card-content>
            </ion-card>

            <ion-card class="text-center mx-0 mt-0 border-top">
                <ion-card-header>
                    <ion-card-subtitle id="mes">6 Mes</ion-card-subtitle>
                    <ion-card-title class="fw-normal" id="dinero">{{precio6mes}}&euro;</ion-card-title>
                </ion-card-header>
                <ion-card-content>
                    <button class="btn" id="comprar">Próximamente</button>
                    <!-- <button class="btn" id="comprar" (click)="comprarModal()">Próximamente</button> -->
                </ion-card-content>
            </ion-card>

        </ion-card-content>
    </ion-card>
</ion-content>
