<ion-content style="--background: var(--sl-bg)">

  <div class="activities-grid">

    <div class="activity-card" [routerLink]="['/dashboard/pilates']">

      <div class="activity-card-body">

      </div>

    <div class="activity-card" [routerLink]="['/dashboard/aerosoluna']">

      </div>
    </div>

      <div class="activity-card-overlay"></div>

    <div class="activity-card" [routerLink]="['/dashboard/entrenam-personal']">
