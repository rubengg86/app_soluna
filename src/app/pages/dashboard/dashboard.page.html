<!-----------------------------------------NAVEGADOR---------------------------------->
<ion-header>
    <ion-toolbar style="--background: #363636;">
        <!-- <ion-toolbar color="light"> -->
        <!---------------------------------DIV IZQUIERDO: IMAGEN Y NOMBRE--------------->
        <div class="px-3 pt-2 " *ngIf="cliente">
            <img *ngIf="cliente.photo" [src]='"https://belife.io/cust_photo/" + cliente.photo' alt="">
            <img *ngIf="!cliente.photo" src="../../../../../assets/img/avatar.jpg" alt="">
            <!--
          <span class="text-black fw-bold">NOMBRE</span>
          -->
        </div>
        <!-------------------------------------------BOTON MENU------------------------->
        <ion-buttons slot="end" id="menu">
            <ion-menu-button><i class="fas fa-bars fa-lg text-white"></i></ion-menu-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>
