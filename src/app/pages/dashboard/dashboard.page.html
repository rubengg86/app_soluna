<!-- Dashboard shell: router outlet + persistent bottom tab bar -->
<ion-router-outlet></ion-router-outlet>

<nav class="sl-tab-bar">
  <a class="sl-tab-item" routerLinkActive="sl-tab-active" routerLink="/dashboard/tu-panel" (click)="navigateTo('/dashboard/tu-panel')">
    <div class="sl-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
    </div>
    <span class="sl-tab-label">Panel</span>
  </a>

  <a class="sl-tab-item" routerLinkActive="sl-tab-active" routerLink="/dashboard/tus-clases" (click)="navigateTo('/dashboard/tus-clases')">
    <div class="sl-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    <span class="sl-tab-label">Mis clases</span>
  </a>

  <a class="sl-tab-item" routerLinkActive="sl-tab-active" routerLink="/dashboard/mi-cuenta" (click)="navigateTo('/dashboard/mi-cuenta')">
    <div class="sl-tab-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/>
      </svg>
    </div>
    <span class="sl-tab-label">Mi cuenta</span>
  </a>
</nav>
