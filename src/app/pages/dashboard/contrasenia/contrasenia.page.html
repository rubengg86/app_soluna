<!---------------------------------------------------------------- MODAL (cambiar contraseña)------------------------------------------------------------->
<!-------------------------------------------------------------------CABECERA ---------------------------------------------------------------->
<ion-header id="header" >
    <ion-toolbar class="p-3" color="light">
        <div class="d-flex justify-content-between">
            <ion-title class="text-black">
                CONTRASEÑA NUEVA
            </ion-title>
            <i class="fas fa-times text-black fa-2x pt-1" (click)="dismiss()"></i>
        </div>
    </ion-toolbar>
</ion-header>
<ion-content id="contenido" color="light">
    <br>
    <!-------------------------------------------------------------------FORMULARIO ---------------------------------------------------------------->
    <form action="" class="p-4">
        <ion-input placeholder="Contraseña antigua" class="border-bottom mb-3"></ion-input>
        <ion-input placeholder="Contraseña nueva" class="border-bottom mb-3"></ion-input>
        <ion-input placeholder="Confirma la nueva contraseña" class="border-bottom mb-3"></ion-input>
    </form>
    <!-------------------------------------------------------------------FOOTER-------------------------------------------------------------------->
 
</ion-content>
    <ion-footer class="p-4" id="footer">
        <button type="button" class="btn" id="guardar">Guardar</button>
    </ion-footer>
