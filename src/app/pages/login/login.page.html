<div class="login-screen">

  <!-- ── Hero with logo ── -->
  <div class="login-hero">
    <div class="login-logo-wrap">
      <img src="../../../assets/img/logo_blanco.png" alt="Soluna" class="login-logo">
    </div>
    <p class="login-tagline">Tu espacio de bienestar</p>
  </div>

  <!-- ── Form sheet ── -->
  <div class="login-sheet">
    <h2 class="login-sheet-title">Bienvenida</h2>

    <form [formGroup]="form" (ngSubmit)="onLogin()">
      <div *ngIf="incorrect" class="login-error">
        Usuario o contraseña incorrectos
      </div>

      <div class="sl-input-group">
        <label class="sl-input-label">Usuario</label>
        <div class="sl-input-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.58-7 8-7s8 3 8 7"/></svg>
          <ion-input placeholder="Email o usuario" formControlName="nombre" required></ion-input>
        </div>
      </div>

      <div class="sl-input-group">
        <label class="sl-input-label">Contraseña</label>
        <div class="sl-input-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          <ion-input placeholder="Contraseña" type="password" formControlName="pass" required></ion-input>
        </div>
      </div>

      <button class="sl-btn-primary" type="submit" style="margin-top: 8px;">
        Acceder
      </button>
    </form>

    <div class="login-links">
      <a (click)="recoverPassword()">¿Olvidaste tu contraseña?</a>
      <a (click)="registerUser()" class="login-link-accent">Regístrate</a>
    </div>

    <footer class="login-footer">Soluna cuerpo y mente</footer>
  </div>

</div>
