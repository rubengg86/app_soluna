<div class="container-fluid">
    <div class="row vh-100 justify-content-center align-items-center">
        <div class="col-auto p-5">
            <form [formGroup]="forma" (ngSubmit)="onLogin()">
                <img src="../../../assets/img/logo_blanco.png" alt="" width="70%" class="d-block m-auto">
                <h4 class="text-center my-3">Iniciar sesi&oacute;n con tu cuenta</h4>

                <div *ngIf="incorrecto"><small style="color: red;">Usuario o contraseña incorrectos</small></div>

                <div class="container-fluid">
                    <div class="row align-items-center border-bottom">
                        <i class="col-2 fas fa-user-circle fa-lg border-0 color"></i>
                        <ion-input class="col-10 border-0 " placeholder="Usuario" formControlName="nombre" required></ion-input>
                    </div>

                    <div class="row align-items-center border-bottom">
                        <i class="col-2 fas fa-unlock fa-lg border-0 color"></i>
                        <ion-input class="col-10 border-0 " placeholder="Contraseña" formControlName="pass" required></ion-input>
                    </div>
                </div>
                <button class="btn btn-dark mt-3" type="submit">Acceder</button>
            </form>
            <div class="container-fluid my-4">
                <div class="row d-flex justify-content-start mb-2">
                    <ion-checkbox checked="false" class="cheack col-1 check"></ion-checkbox>
                    <label for="" class="col-10">Recuérdame</label>
                </div>
                <a (click)="recuperarContrasenia()" class="row mb-2">¿Has olvidado tu contraseña?</a>
                <!-- <a href="" class="row">Regístrate</a> -->

            </div>
            <footer>
                © 2021 Soluna cuerpo y mente
            </footer>
        </div>
    </div>
</div>
